name: todo_list
description: Application To-Do List — Projet Flutter universitaire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2

  # Persistance légère — séance 10
  shared_preferences: ^2.3.5

  # Base de données SQLite — séances 11 et 12
  sqflite: ^2.4.2
  path: ^1.9.0

  # Notifications locales — séance 13
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true